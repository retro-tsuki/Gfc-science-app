<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset='utf-8' />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:type" content="article" />
    <meta property="og:url" content="https://maps.zaritsuri.com/schedule/" />
    <meta property="og:image" content="https://maps.zaritsuri.com/schedule/" />
    <meta property="og:locale" content="ja_JP" />
    <title>科学部 予定管理</title>
    <link rel="icon" href="./favicon.ico" type="image/x-icon">
    <link rel="apple-touch-icon" size="180x180" href="apple-touch-icon.png">
    <!-- FullCalendar v6 -->
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js'></script>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            margin: 10px; 
            background-color: #f0f2f5; 
            color: #333; 
        }
        #calendar { 
            max-width: 900px; 
            margin: 0 auto; 
            background: white; 
            padding: 10px; 
            border-radius: 12px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
            min-height: 400px; 
        }

        /* -------------------------------------------------- */
        /* 🎯 過去予定のグレーアウトスタイル               */
        /* -------------------------------------------------- */
        .fc-event.is-past {
            background-color: #9e9e9e !important;
            border-color: #9e9e9e !important;
            color: #ffffff !important;
            opacity: 0.6 !important;
        }
        .fc-event.is-past .fc-event-text-block {
            color: #ffffff !important;
        }

        /* -------------------------------------------------- */
        /* 🎯 祝日スタイル（*から始まる予定）                   */
        /* -------------------------------------------------- */
        .fc-event.is-holiday {
            background-color: #dc3545 !important;
            border-color: #dc3545 !important;
            color: #ffffff !important;
        }
        .fc-event.is-holiday .fc-event-text-block {
            color: #ffffff !important;
            font-weight: bold;
        }

        /* -------------------------------------------------- */
        /* 🎯 シームレス＆冒頭一時停止 弾幕専用スタイル      */
        /* -------------------------------------------------- */
        .fc-event {
            overflow: hidden !important;
            white-space: nowrap !important;
            max-width: 100% !important;
        }

        .fc-event-main {
            overflow: hidden !important;
            white-space: nowrap !important;
            display: flex !important;
            align-items: center;
            width: 100%;
        }

        .fc-daygrid-event-dot {
            flex-shrink: 0;
            margin-right: 4px;
        }

        .fc-event-scroll-wrapper {
            overflow: hidden;
            white-space: nowrap;
            flex-grow: 1;
            min-width: 0;
        }

        .fc-event-scroll-content {
            display: inline-flex !important;
            white-space: nowrap !important;
            will-change: transform;
        }

        .fc-event-text-block {
            display: inline-block;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .fc-event.has-overflow .fc-event-scroll-content {
            animation: seamless-danmaku-pause 10s linear infinite;
        }

        .fc-event:hover .fc-event-scroll-content {
            animation-play-state: paused;
        }

        @keyframes seamless-danmaku-pause {
            0% { transform: translateX(0%); }
            15% { transform: translateX(0%); }
            100% { transform: translateX(-50%); }
        }

        /* -------------------------------------------------- */
        /* UI & フォームスタイル                              */
        /* -------------------------------------------------- */
        .form-container {
            max-width: 900px;
            margin: 20px auto;
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .form-container h2 { margin-top: 0; font-size: 1.2rem; }
        .form-group { margin-bottom: 14px; }
        .form-group label {
            display: block;
            font-size: 0.9rem;
            font-weight: bold;
            margin-bottom: 6px;
            color: #555;
        }
        .form-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
        }
        .field-box { flex: 1 1 0%; min-width: 0; }
        .range-separator {
            width: 28px;
            flex-shrink: 0;
            font-weight: bold;
            color: #666;
            text-align: center;
            line-height: 42px;
            user-select: none;
        }
        input[type="text"], input[type="date"], input[type="time"] {
            width: 100%;
            height: 42px;
            padding: 0 10px;
            margin: 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            background-color: #fff;
            appearance: none;
            -webkit-appearance: none;
        }
        input:disabled {
            background-color: #e9ecef;
            color: #6c757d;
            cursor: not-allowed;
            border-color: #ced4da;
        }
        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 6px;
            cursor: pointer;
            font-size: 0.95rem;
            user-select: none;
        }
        .checkbox-container input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            margin: 0;
        }
        button.submit-btn {
            width: 100%;
            height: 44px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        button.submit-btn:active { background-color: #0056b3; }
        
        .header-container {
            max-width: 900px;
            margin: 0 auto 10px auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        h1 { margin: 0; font-size: 1.5rem; }
        
        .header-buttons {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }
        .help-btn, .schedule-btn, .annual-btn, .weekly-btn {
            background-color: #6c757d;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
            width: auto;
        }
        .weekly-btn { background-color: #fd7e14; }
        .weekly-btn:active { background-color: #e36d0c; }
        .schedule-btn { background-color: #28a745; }
        .schedule-btn:active { background-color: #218838; }
        .annual-btn { background-color: #17a2b8; }
        .annual-btn:active { background-color: #138496; }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 9998;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background-color: #fff;
            width: 90%;
            max-width: 500px;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            position: relative;
        }

        /* -------------------------------------------------- */
        /* 📄 行事予定表モーダル専用カスタムスタイル           */
        /* -------------------------------------------------- */
        .modal-content.schedule-modal {
            max-width: 850px;
            height: 88vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }
        .schedule-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .modal-content h3 {
            margin: 0; font-size: 1.2rem;
            color: #333;
        }
        .pdf-controls {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .pdf-control-btn {
            background: #f8f9fa;
            border: 1px solid #ccc;
            border-radius: 6px;
            padding: 5px 10px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            color: #333;
            transition: background 0.2s;
        }
        .pdf-control-btn:hover { background: #e2e6ea; }
        .pdf-control-btn:active { background: #d6dbdf; }

        .pdf-container {
            flex-grow: 1;
            width: 100%;
            border: 1px solid #ddd;
            border-radius: 8px;
            overflow: auto;
            background: #f8f9fa;
            position: relative;
            -webkit-overflow-scrolling: touch;
        }
        .pdf-container iframe {
            width: 100%;
            height: 100%;
            border: none;
            transform-origin: top left;
            transition: transform 0.1s ease, width 0.1s ease, height 0.1s ease;
        }

        .modal-close-btn {
            background: #ffffff; 
            border: 1px solid #ced4da;
            color: #333333; 
            font-size: 18px; 
            font-weight: bold;
            cursor: pointer; 
            border-radius: 50%;
            width: 30px; height: 30px;
            display: flex; align-items: center; justify-content: center;
            padding: 0; line-height: 1;
            transition: background 0.2s, color 0.2s;
        }
        .modal-close-btn:hover { 
            background: #e9ecef; 
            color: #000000;
        }

        .modal-content ul { padding-left: 20px; line-height: 1.6; }

        /* -------------------------------------------------- */
        /* 📌 バージョンフッターセクションスタイル             */
        /* -------------------------------------------------- */
        .version-footer {
            max-width: 900px;
            margin: 30px auto 20px auto;
            text-align: left;
        }
        .version-card {
            background: #fff;
            padding: 18px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .version-card h3 {
            margin: 0 0 10px 0;
            font-size: 1rem;
            color: #444;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .version-content {
            font-size: 0.9rem;
            color: #555;
            line-height: 1.6;
        }
        .version-content ul {
            margin: 0;
            padding-left: 20px;
        }

        .loading-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: rgba(255, 255, 255, 0.85);
            z-index: 999999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            backdrop-filter: blur(2px);
        }
        .spinner {
            width: 50px; height: 50px;
            border: 5px solid #e0e0e0;
            border-top: 5px solid #007bff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .loading-text {
            margin-top: 15px; font-size: 16px; font-weight: bold;
            color: #007bff; letter-spacing: 0.5px; text-align: center; padding: 0 20px;
        }
    </style>
</head>
<body>

    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
        <div class="loading-text" id="loadingText">処理中…</div>
    </div>

    <div class="header-container">
        <h1>🧪 科学部 予定管理</h1>
        <div class="header-buttons">
            <button class="weekly-btn" id="openWeeklyBtn">📋 週間行事予定表</button>
            <button class="schedule-btn" id="openMonthlyBtn">📄 月間行事予定表</button>
            <button class="annual-btn" id="openAnnualBtn">📅 年間行事予定表</button>
            <button class="help-btn" id="openHelpBtn">❓ 使い方</button>
        </div>
    </div>

    <div id='calendar'></div>

    <div class="form-container">
        <h2>📅 予定を追加する</h2>
        
        <div class="form-group">
            <label for="eventTitle">予定の名前（※祝日は先頭に * を付ける）</label>
            <input type="text" id="eventTitle" placeholder="（例：夏合宿、*秋分の日）">
        </div>

        <div class="form-group">
            <label>期間指定</label>
            <div class="form-row">
                <div class="field-box"><input type="date" id="eventStartDate"></div>
                <div class="range-separator">〜</div>
                <div class="field-box"><input type="date" id="eventEndDate"></div>
            </div>
        </div>

        <div class="form-group">
            <div class="checkbox-container">
                <input type="checkbox" id="allDayCheck" checked>
                <label for="allDayCheck" style="margin:0; cursor:pointer;">終日</label>
            </div>
        </div>

        <div class="form-group">
            <label>時間指定</label>
            <div class="form-row">
                <div class="field-box"><input type="time" id="eventStartTime" disabled></div>
                <div class="range-separator">〜</div>
                <div class="field-box"><input type="time" id="eventEndTime" disabled></div>
            </div>
        </div>

        <button class="submit-btn" id="addBtn">カレンダーに追加</button>
    </div>

    <!-- 📌 最下部のバージョン・更新履歴セクション -->
    <footer class="version-footer">
        <div class="version-card">
            <h3>📌 バージョン・更新履歴</h3>
            <div class="version-content" id="versionContent">
                読み込み中…
            </div>
        </div>
    </footer>

    <!-- 使い方モーダル -->
    <div class="modal-overlay" id="helpModal">
        <div class="modal-content">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                <h3 style="margin: 0;">📖 予定管理の使い方</h3>
                <button class="modal-close-btn" id="closeHelpBtn">&times;</button>
            </div>
            <ul>
                <li><strong>予定の確認:</strong> カレンダー上で科学部の予定を確認できます。</li>
                <li><strong>祝日の登録:</strong> 予定名の先頭に <code>*</code> を入力すると赤背景（祝日）として登録されます。</li>
                <li><strong>過去の予定:</strong> 既に終了した過去の予定は自動的にグレーアウト表示されます。</li>
                <li><strong>予定の追加:</strong> フォームから「予定名」「期間」「時間」を設定して追加します。</li>
                <li><strong>予定の削除:</strong> カレンダー上の予定をクリックして削除します。</li>
            </ul>
        </div>
    </div>

    <!-- 📄 行事予定表共通モーダル -->
    <div class="modal-overlay" id="scheduleModal">
        <div class="modal-content schedule-modal" id="scheduleModalContent">
            <div class="schedule-header-row">
                <h3 id="scheduleTitle">📄 行事予定表</h3>
                <div class="pdf-controls">
                    <button class="pdf-control-btn" id="zoomOutBtn" title="縮小">-</button>
                    <button class="pdf-control-btn" id="zoomResetBtn" title="ズームリセット">100%</button>
                    <button class="pdf-control-btn" id="zoomInBtn" title="拡大">+</button>
                    <button class="pdf-control-btn" id="fullscreenBtn" title="全画面表示">⛶ 全画面</button>
                    <button class="modal-close-btn" id="closeScheduleBtn">&times;</button>
                </div>
            </div>
            <hr style="border: none; border-top: 1px solid #ddd; margin: 10px 0 12px 0;">
            <div class="pdf-container" id="pdfContainer">
                <iframe id="pdfFrame" src=""></iframe>
            </div>
        </div>
    </div>

    <script>
      const loadingOverlay = document.getElementById('loadingOverlay');
      const loadingText = document.getElementById('loadingText');
      const CACHE_KEY = 'science_club_events_cache';

      function showLoading(msg = '処理中…') {
        loadingText.textContent = msg;
        loadingOverlay.style.display = 'flex';
      }

      function hideLoading() {
        loadingOverlay.style.display = 'none';
      }

      const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxlFIYrp2JuigWirQ6aGd0SrDjrQOWcZ3KooV5esH-6DqQL-fAtk5tTwi387J6p_fQAQA/exec';

      async function fetchGasApi(options = {}, maxRetries = 2) {
        let attempt = 0;
        
        while (attempt < maxRetries) {
          try {
            attempt++;
            const url = options.url || GAS_WEB_APP_URL;
            const method = options.method || 'GET';
            
            let fetchOptions = {
              method: method,
              redirect: 'follow'
            };

            if (method === 'POST') {
              fetchOptions.body = JSON.stringify(options.body || {});
              fetchOptions.headers = { 'Content-Type': 'text/plain;charset=utf-8' };
            }

            const response = await fetch(url, fetchOptions);
            if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);
            
            const json = await response.json();
            
            if (json && json.error) {
              alert("エラーが発生しました:\n" + json.error);
              throw new Error(json.error);
            }

            return json;

          } catch (err) {
            console.warn(`通信試行 (${attempt}/${maxRetries}):`, err.message);

            if (attempt < maxRetries) {
              await new Promise(res => setTimeout(res, 1000));
            } else {
              hideLoading();
              throw err;
            }
          }
        }
      }

      function formatEvents(data) {
        if (!Array.isArray(data)) return [];
        return data.map(event => ({
          id: event.id,
          title: event.title,
          start: event.start,
          end: event.end || null,
          allDay: (event.all_day !== undefined) ? event.all_day : (event.allDay !== undefined ? event.allDay : true)
        }));
      }

      // 📌 README.md の AUTO-UPDATE タグ内を自動取得して表示する関数
      async function loadReadmeVersion() {
        const versionContentEl = document.getElementById('versionContent');
        try {
          const res = await fetch(`./README.md?v=${Date.now()}`);
          if (!res.ok) throw new Error("README.mdが見つかりませんでした");
          
          const markdownText = await res.text();
          const match = markdownText.match(/<!--\s*AUTO-UPDATE:START\s*-->([\s\S]*?)<!--\s*AUTO-UPDATE:END\s*-->/);
          
          if (match && match[1]) {
            const rawContent = match[1].trim();
            const lines = rawContent.split('\n').map(line => line.trim()).filter(line => line.startsWith('-'));
            
            if (lines.length > 0) {
              let htmlList = '<ul>';
              lines.forEach(line => {
                const itemText = line.replace(/^-/, '').trim();
                htmlList += `<li>${itemText}</li>`;
              });
              htmlList += '</ul>';
              versionContentEl.innerHTML = htmlList;
            } else {
              versionContentEl.textContent = rawContent;
            }
          } else {
            versionContentEl.textContent = "更新履歴が見つかりませんでした。";
          }
        } catch (e) {
          console.warn("バージョン情報の読み込みに失敗:", e);
          versionContentEl.textContent = "バージョン情報の取得に失敗しました。";
        }
      }

      document.addEventListener('DOMContentLoaded', function() {
        loadReadmeVersion();

        // --- モーダル関連の処理 ---
        const openHelpBtn = document.getElementById('openHelpBtn');
        const closeHelpBtn = document.getElementById('closeHelpBtn');
        const helpModal = document.getElementById('helpModal');

        const openWeeklyBtn = document.getElementById('openWeeklyBtn');
        const openMonthlyBtn = document.getElementById('openMonthlyBtn');
        const openAnnualBtn = document.getElementById('openAnnualBtn');
        const closeScheduleBtn = document.getElementById('closeScheduleBtn');
        const scheduleModal = document.getElementById('scheduleModal');
        const scheduleTitle = document.getElementById('scheduleTitle');
        const pdfFrame = document.getElementById('pdfFrame');
        const pdfContainer = document.getElementById('pdfContainer');

        const zoomInBtn = document.getElementById('zoomInBtn');
        const zoomOutBtn = document.getElementById('zoomOutBtn');
        const zoomResetBtn = document.getElementById('zoomResetBtn');
        const fullscreenBtn = document.getElementById('fullscreenBtn');

        const isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
        let currentScale = 1.33;

        function updateZoom(newScale) {
          if (isTouchDevice) return;
          currentScale = Math.max(0.5, Math.min(3.0, newScale));
          pdfFrame.style.width = `${(100 / currentScale)}%`;
          pdfFrame.style.height = `${(100 / currentScale)}%`;
          pdfFrame.style.transform = `scale(${currentScale})`;
          zoomResetBtn.textContent = `${Math.round(currentScale * 100)}%`;
        }

        zoomInBtn.addEventListener('click', () => updateZoom(currentScale + 0.25));
        zoomOutBtn.addEventListener('click', () => updateZoom(currentScale - 0.25));
        zoomResetBtn.addEventListener('click', () => updateZoom(1.0));

        fullscreenBtn.addEventListener('click', () => {
          if (!document.fullscreenElement) {
            if (pdfContainer.requestFullscreen) {
              pdfContainer.requestFullscreen();
            } else if (pdfContainer.webkitRequestFullscreen) {
              pdfContainer.webkitRequestFullscreen();
            }
          } else {
            if (document.exitFullscreen) {
              document.exitFullscreen();
            } else if (document.webkitExitFullscreen) {
              document.webkitExitFullscreen();
            }
          }
        });

        document.addEventListener('fullscreenchange', () => {
          if (document.fullscreenElement) {
            currentScale = 1.0;
            if (!isTouchDevice) updateZoom(1.0);
          } else {
            currentScale = 1.33;
            if (!isTouchDevice) updateZoom(1.33);
          }
        });

        openHelpBtn.addEventListener('click', () => helpModal.style.display = 'flex');
        closeHelpBtn.addEventListener('click', () => helpModal.style.display = 'none');
        helpModal.addEventListener('click', (e) => {
          if (e.target === helpModal) helpModal.style.display = 'none';
        });

        // 📋 週間行事予定表ボタンの処理
        openWeeklyBtn.addEventListener('click', async () => {
          currentScale = 1.33;
          if (!isTouchDevice) {
            updateZoom(1.33);
          } else {
            pdfFrame.style.width = '100%';
            pdfFrame.style.height = '100%';
            pdfFrame.style.transform = 'none';
          }

          const pdfUrl = `./weeklySchedule/schedule.pdf`;
          scheduleTitle.textContent = "📋 週間行事予定表（読み込み中…）";
          pdfFrame.src = pdfUrl;
          scheduleModal.style.display = 'flex';

          try {
            const res = await fetch(pdfUrl, { method: 'HEAD' });
            const lastModified = res.headers.get('Last-Modified');
            if (lastModified) {
              const fileDate = new Date(lastModified);
              const monthNum = fileDate.getMonth() + 1;
              const dayNum = fileDate.getDate();
              scheduleTitle.textContent = `📋 週間行事予定表（${monthNum}月${dayNum}日更新）`;
            } else {
              scheduleTitle.textContent = "📋 週間行事予定表";
            }
          } catch (e) {
            console.warn("最終更新日の取得に失敗しました:", e);
            scheduleTitle.textContent = "📋 週間行事予定表";
          }
        });

        // 📄 月間行事予定表ボタンの処理
        openMonthlyBtn.addEventListener('click', async () => {
          currentScale = 1.33;
          if (!isTouchDevice) {
            updateZoom(1.33);
          } else {
            pdfFrame.style.width = '100%';
            pdfFrame.style.height = '100%';
            pdfFrame.style.transform = 'none';
          }

          const pdfUrl = `./monthlySchedule/schedule.pdf`;
          scheduleTitle.textContent = "📄 月間行事予定表（読み込み中…）";
          pdfFrame.src = pdfUrl;
          scheduleModal.style.display = 'flex';

          try {
            const res = await fetch(pdfUrl, { method: 'HEAD' });
            const lastModified = res.headers.get('Last-Modified');
            if (lastModified) {
              const fileDate = new Date(lastModified);
              const monthNum = fileDate.getMonth() + 1;
              scheduleTitle.textContent = `📄 月間行事予定表（${monthNum}月）`;
            } else {
              scheduleTitle.textContent = "📄 月間行事予定表";
            }
          } catch (e) {
            console.warn("最終更新日の取得に失敗しました:", e);
            scheduleTitle.textContent = "📄 月間行事予定表";
          }
        });

        // 📅 年間行事予定表ボタンの処理
        openAnnualBtn.addEventListener('click', async () => {
          currentScale = 1.33;
          if (!isTouchDevice) {
            updateZoom(1.33);
          } else {
            pdfFrame.style.width = '100%';
            pdfFrame.style.height = '100%';
            pdfFrame.style.transform = 'none';
          }

          const pdfUrl = `./annualSchedule/schedule.pdf`;
          scheduleTitle.textContent = "📅 年間行事予定表（読み込み中…）";
          pdfFrame.src = pdfUrl;
          scheduleModal.style.display = 'flex';

          try {
            const res = await fetch(pdfUrl, { method: 'HEAD' });
            const lastModified = res.headers.get('Last-Modified');
            if (lastModified) {
              const fileDate = new Date(lastModified);
              const yearNum = fileDate.getFullYear();
              scheduleTitle.textContent = `📅 年間行事予定表（${yearNum}年）`;
            } else {
              scheduleTitle.textContent = "📅 年間行事予定表";
            }
          } catch (e) {
            console.warn("最終更新日の取得に失敗しました:", e);
            scheduleTitle.textContent = "📅 年間行事予定表";
          }
        });

        closeScheduleBtn.addEventListener('click', () => {
          scheduleModal.style.display = 'none';
          pdfFrame.src = "";
          if (document.fullscreenElement) document.exitFullscreen();
        });

        scheduleModal.addEventListener('click', (e) => {
          if (e.target === scheduleModal) {
            scheduleModal.style.display = 'none';
            pdfFrame.src = "";
            if (document.fullscreenElement) document.exitFullscreen();
          }
        });

        // --- フォーム関連の処理 ---
        const allDayCheck = document.getElementById('allDayCheck');
        const eventStartTime = document.getElementById('eventStartTime');
        const eventEndTime = document.getElementById('eventEndTime');
        const eventStartDate = document.getElementById('eventStartDate');
        const eventEndDate = document.getElementById('eventEndDate');

        allDayCheck.addEventListener('change', function() {
          const isAllDay = this.checked;
          eventStartTime.disabled = isAllDay;
          eventEndTime.disabled = isAllDay;
          if (isAllDay) {
            eventStartTime.value = '';
            eventEndTime.value = '';
          }
        });

        eventStartDate.addEventListener('change', function() {
          if (!eventEndDate.value) {
            eventEndDate.value = this.value;
          }
        });

        var calendarEl = document.getElementById('calendar');
        var eventTitleInput = document.getElementById('eventTitle');
        var addBtn = document.getElementById('addBtn');

        var calendar = new FullCalendar.Calendar(calendarEl, {
          initialView: 'dayGridMonth',
          locale: 'ja',
          displayEventEnd: true,
          eventTimeFormat: {
            hour: 'numeric',
            minute: '2-digit',
            meridiem: false,
            omitZeroMinute: false
          },

          headerToolbar: {
            left: 'prev,next',
            center: 'title',
            right: 'today'
          },

          eventContent: function(arg) {
            let nodes = [];

            if (!arg.event.allDay) {
              let dot = document.createElement('div');
              dot.className = 'fc-daygrid-event-dot';
              nodes.push(dot);
            }

            let rawTitle = arg.event.title || '';
            let displayTitle = rawTitle.startsWith('*') ? rawTitle.slice(1) : rawTitle;

            let timeText = arg.timeText ? arg.timeText + ' ' : '';
            let baseText = timeText + displayTitle;

            let wrapper = document.createElement('div');
            wrapper.className = 'fc-event-scroll-wrapper';

            let content = document.createElement('div');
            content.className = 'fc-event-scroll-content';

            let span1 = document.createElement('span');
            span1.className = 'fc-event-text-block';
            span1.innerText = baseText;

            content.appendChild(span1);
            wrapper.appendChild(content);
            nodes.push(wrapper);

            return { domNodes: nodes };
          },

          eventDidMount: function(arg) {
            const el = arg.el;
            const rawTitle = arg.event.title || '';

            const now = new Date();
            now.setHours(0, 0, 0, 0);

            const eventTargetDate = arg.event.end ? new Date(arg.event.end) : new Date(arg.event.start);
            if (arg.event.allDay && arg.event.end) {
              eventTargetDate.setTime(eventTargetDate.getTime() - 1);
            }

            if (eventTargetDate < now) {
              el.classList.add('is-past');
            } else if (rawTitle.startsWith('*')) {
              el.classList.add('is-holiday');
            }

            requestAnimationFrame(() => {
              const wrapper = el.querySelector('.fc-event-scroll-wrapper');
              const content = el.querySelector('.fc-event-scroll-content');
              const firstBlock = el.querySelector('.fc-event-text-block');
              
              if (wrapper && firstBlock && content) {
                if (firstBlock.offsetWidth > wrapper.clientWidth + 1) {
                  let displayTitle = rawTitle.startsWith('*') ? rawTitle.slice(1) : rawTitle;
                  let timeText = arg.timeText ? arg.timeText + ' ' : '';
                  let baseText = timeText + displayTitle;

                  firstBlock.innerText = baseText + '　　';

                  const existingBlocks = content.querySelectorAll('.fc-event-text-block');
                  if (existingBlocks.length > 1) {
                    existingBlocks[1].remove();
                  }

                  let span2 = document.createElement('span');
                  span2.className = 'fc-event-text-block';
                  span2.innerText = baseText + '　　';
                  content.appendChild(span2);

                  el.classList.add('has-overflow');
                } else {
                  el.classList.remove('has-overflow');
                  const existingBlocks = content.querySelectorAll('.fc-event-text-block');
                  if (existingBlocks.length > 1) {
                    existingBlocks[1].remove();
                  }
                }
              }
            });
          },

          events: async function(fetchInfo, successCallback, failureCallback) {
            const cachedData = localStorage.getItem(CACHE_KEY);
            if (cachedData) {
              try {
                const parsedCache = JSON.parse(cachedData);
                successCallback(formatEvents(parsedCache));
              } catch (e) {
                console.warn("キャッシュパースエラー:", e);
              }
            }

            try {
              const freshData = await fetchGasApi();
              if (Array.isArray(freshData)) {
                localStorage.setItem(CACHE_KEY, JSON.stringify(freshData));
                
                if (!cachedData) {
                  successCallback(formatEvents(freshData));
                }
              }
            } catch (err) {
              if (!cachedData) {
                failureCallback(err);
              }
            }
          },

          eventClick: async function(info) {
            let displayTitle = info.event.title.startsWith('*') ? info.event.title.slice(1) : info.event.title;
            if (confirm('「' + displayTitle + '」を削除しますか？')) {
              showLoading('削除中…');
              try {
                await fetchGasApi({
                  method: 'POST',
                  body: { action: 'delete', id: info.event.id }
                });

                const cachedData = localStorage.getItem(CACHE_KEY);
                if (cachedData) {
                  const parsed = JSON.parse(cachedData).filter(item => String(item.id) !== String(info.event.id));
                  localStorage.setItem(CACHE_KEY, JSON.stringify(parsed));
                }

                calendar.refetchEvents();

              } catch (err) {
                alert('削除に失敗しました');
              } finally {
                hideLoading();
              }
            }
          }
        });

        calendar.render();

        addBtn.addEventListener('click', async function() {
          var title = eventTitleInput.value.trim();
          var startDate = eventStartDate.value;
          var endDate = eventEndDate.value || startDate;
          var isAllDay = allDayCheck.checked;
          var startTime = eventStartTime.value;
          var endTime = eventEndTime.value;

          if (!title || !startDate) {
            alert('予定の名前と開始日を入力してください');
            return;
          }

          let startIso = '';
          let endIso = '';

          if (isAllDay) {
            startIso = startDate;
            let endD = new Date(endDate);
            endD.setDate(endD.getDate() + 1);
            endIso = endD.toISOString().split('T')[0];
          } else {
            if (!startTime) {
              alert('開始時間を入力してください');
              return;
            }
            startIso = `${startDate}T${startTime}:00+09:00`;
            if (endTime) {
              endIso = `${endDate}T${endTime}:00+09:00`;
            } else {
              endIso = `${endDate}T${startTime}:00+09:00`;
            }
          }

          const newEventPayload = {
            title: title, 
            start: startIso, 
            end: endIso, 
            all_day: isAllDay
          };

          showLoading('追加中…');
          try {
            const res = await fetchGasApi({
              method: 'POST',
              body: {
                action: 'insert',
                data: [newEventPayload]
              }
            });

            if (res) {
              const insertedItem = Array.isArray(res) ? res[0] : res;
              const createdEvent = {
                id: insertedItem.id || Date.now(),
                title: title,
                start: startIso,
                end: endIso,
                allDay: isAllDay
              };

              const cachedData = localStorage.getItem(CACHE_KEY);
              let currentCache = cachedData ? JSON.parse(cachedData) : [];
              currentCache.push(insertedItem.id ? insertedItem : createdEvent);
              localStorage.setItem(CACHE_KEY, JSON.stringify(currentCache));

              calendar.refetchEvents();

              eventTitleInput.value = '';
              eventStartDate.value = '';
              eventEndDate.value = '';
              eventStartTime.value = '';
              eventEndTime.value = '';
              allDayCheck.checked = true;
              eventStartTime.disabled = true;
              eventEndTime.disabled = true;
            }

          } catch (err) {
            alert('予定の追加に失敗しました');
          } finally {
            hideLoading();
          }
        });
      });
    </script>
</body>
</html>
